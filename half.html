<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Half · Dailyish</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="index.html">daily<span>ish</span></a>
      <nav><a href="index.html">All games</a></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="game-top">
      <div><strong id="title">Half #1</strong> <span id="modeLabel"></span></div>
      <div id="hud">Shape 1 / 3</div>
    </div>

    <canvas id="c" width="800" height="500" style="touch-action:none"></canvas>

    <div class="msg" id="msg">Drag one straight line to cut the shape into two equal halves.</div>

    <div class="result hidden" id="result">
      <div class="big" id="total"></div>
      <div class="emojis" id="emojis"></div>
      <div class="sub" id="sub"></div>
    </div>

    <div class="actions">
      <button class="btn hidden" id="nextBtn">Next shape</button>
      <button class="btn hidden" id="shareBtn">Share score</button>
      <button class="btn ghost hidden" id="practiceBtn">Practice mode</button>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p class="idea">💡 Got an idea for a new game? Send it to <a href="mailto:sjein0809@gmail.com?subject=dailyish%20game%20idea">sjein0809@gmail.com</a></p>
      <div class="foot-row">
        <span>dailyish · new puzzles every midnight</span>
        <a class="insta" href="https://www.instagram.com/s1wptjg_/" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          @s1wptjg_
        </a>
      </div>
    </div>
  </footer>

<script src="common.js"></script>
<script>
const W = 800, H = 500;
const ROUNDS = 3;
const NAME = "half2"; // bumped when the shape generator changed, so old saves don't replay on new shapes

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
$("title").textContent = "Half #" + Daily.dayNum;

let mode = "daily";
let shapes, ri, cuts, phase, dragA, dragB;

// ===== Shape generation =====
// A shape is a list of parts in "unit" space (main body ~1 unit across),
// unioned together, with "sub" parts cut out (bites, holes).
// Round 0 = odd, round 1 = odd + bites/holes, round 2 = combos + islands.

const TAU = Math.PI * 2;

function makeParts(rand, level) {
  const R = (a, b) => a + rand() * (b - a);
  const pick = arr => arr[Math.floor(rand() * arr.length)];
  const parts = [];

  // a smooth random walk drawn as a fat stroke
  function snake(x, y, ang, steps, step, w, turn) {
    const pts = [[x, y]];
    for (let i = 0; i < steps; i++) {
      ang += R(-turn, turn);
      x += Math.cos(ang) * step; y += Math.sin(ang) * step;
      pts.push([x, y]);
    }
    parts.push({ t: "snake", pts, w });
    return pts[pts.length - 1];
  }

  const families = {
    critter() { // body + head + legs + tail
      const rx = R(0.9, 1.3), ry = R(0.5, 0.8), rot = R(0, TAU);
      parts.push({ t: "ellipse", x: 0, y: 0, rx, ry, rot });
      const ha = R(0, TAU);
      parts.push({ t: "ellipse", x: Math.cos(ha) * rx * 1.1, y: Math.sin(ha) * rx * 0.9, rx: R(0.3, 0.5), ry: R(0.3, 0.5), rot: 0 });
      const legs = 2 + Math.floor(rand() * 4);
      for (let i = 0; i < legs; i++) {
        const a = R(0, TAU);
        snake(Math.cos(a) * rx * 0.7, Math.sin(a) * ry * 0.7, a, 2 + Math.floor(rand() * 2), R(0.35, 0.55), R(0.22, 0.34), 0.8);
      }
    },
    worm() { // one long fat twisty stroke
      snake(-1, R(-0.4, 0.4), R(0, TAU), 6 + Math.floor(rand() * 4), R(0.45, 0.7), R(0.35, 0.6), 1.6);
    },
    star() { // irregular spikes, some very long
      const n = 5 + Math.floor(rand() * 7), pts = [];
      const rot = R(0, TAU);
      for (let i = 0; i < n * 2; i++) {
        const a = rot + i / (n * 2) * TAU;
        const r = i % 2 ? R(0.3, 0.55) : R(0.8, rand() < 0.3 ? 2.0 : 1.3);
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      parts.push({ t: "poly", pts });
    },
    cloud() { // chain of very different circles
      let x = 0, y = 0, r = R(0.5, 0.9);
      const n = 4 + Math.floor(rand() * 4);
      for (let i = 0; i < n; i++) {
        parts.push({ t: "ellipse", x, y, rx: r, ry: r, rot: 0 });
        const a = R(0, TAU), nr = R(0.2, 0.8);
        x += Math.cos(a) * (r + nr) * 0.75; y += Math.sin(a) * (r + nr) * 0.75;
        r = nr;
      }
    },
    hook() { // C / horseshoe with a blob on the end
      const r = R(0.8, 1.1), a0 = R(0, TAU), span = R(3.6, 5.2), pts = [];
      for (let i = 0; i <= 12; i++) {
        const a = a0 + span * i / 12;
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      parts.push({ t: "snake", pts, w: R(0.35, 0.55) });
      const e = pts[rand() < 0.5 ? 0 : pts.length - 1];
      parts.push({ t: "ellipse", x: e[0], y: e[1], rx: R(0.3, 0.55), ry: R(0.3, 0.55), rot: 0 });
    },
  };

  const pool = [["critter", "worm", "star", "cloud", "hook"],
                ["critter", "star", "cloud", "hook"],
                ["critter", "star", "cloud", "hook", "worm"]][level];
  families[pick(pool)]();

  // level 2: bolt on a second family, offset, so it looks mashed together
  if (level === 2) {
    const before = parts.length;
    families[pick(pool)]();
    const ox = R(-0.9, 0.9), oy = R(-0.6, 0.6), s = R(0.6, 0.85);
    for (let i = before; i < parts.length; i++) {
      const p = parts[i];
      const tr = ([x, y]) => [x * s + ox, y * s + oy];
      if (p.t === "ellipse") { [p.x, p.y] = tr([p.x, p.y]); p.rx *= s; p.ry *= s; }
      if (p.t === "snake") { p.pts = p.pts.map(tr); p.w *= s; }
      if (p.t === "poly") p.pts = p.pts.map(tr);
    }
  }

  // bites out of the edge, and a hole in the middle of something big
  if (level >= 1) {
    const solid = parts.filter(p => p.t === "ellipse" && p.rx > 0.45);
    const bites = 1 + Math.floor(rand() * (level + 1));
    for (let i = 0; i < bites; i++) {
      const a = R(0, TAU), d = R(0.7, 1.1);
      parts.push({ t: "ellipse", sub: true, x: Math.cos(a) * d, y: Math.sin(a) * d * 0.7, rx: R(0.2, 0.42), ry: R(0.2, 0.42), rot: 0 });
    }
    if (solid.length && rand() < 0.7) {
      const b = pick(solid);
      parts.push({ t: "ellipse", sub: true, x: b.x + R(-0.2, 0.2) * b.rx, y: b.y, rx: b.rx * R(0.2, 0.35), ry: b.ry * R(0.25, 0.4), rot: R(0, TAU) });
    }
  }

  // level 2: one or two separate islands
  if (level === 2) {
    const n = 1 + Math.floor(rand() * 2);
    for (let i = 0; i < n; i++) {
      const a = R(0, TAU), d = R(1.9, 2.4), r = R(0.18, 0.4);
      parts.push({ t: "ellipse", x: Math.cos(a) * d, y: Math.sin(a) * d * 0.6, rx: r, ry: r * R(0.7, 1.3), rot: 0 });
    }
  }
  return parts;
}

function partBox(p) {
  if (p.t === "ellipse") { const r = Math.max(p.rx, p.ry); return [p.x - r, p.y - r, p.x + r, p.y + r]; }
  const pad = p.t === "snake" ? p.w / 2 : 0;
  const xs = p.pts.map(q => q[0]), ys = p.pts.map(q => q[1]);
  return [Math.min(...xs) - pad, Math.min(...ys) - pad, Math.max(...xs) + pad, Math.max(...ys) + pad];
}

function drawPart(g, p) {
  g.globalCompositeOperation = p.sub ? "destination-out" : "source-over";
  g.fillStyle = g.strokeStyle = "#fff";
  g.beginPath();
  if (p.t === "ellipse") {
    g.ellipse(p.x, p.y, p.rx, p.ry, p.rot, 0, TAU);
    g.fill();
  } else if (p.t === "poly") {
    p.pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]));
    g.closePath();
    g.fill();
  } else {
    const q = p.pts;
    g.moveTo(q[0][0], q[0][1]);
    for (let i = 1; i < q.length - 1; i++)
      g.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2);
    g.lineTo(q[q.length - 1][0], q[q.length - 1][1]);
    g.lineWidth = p.w; g.lineCap = g.lineJoin = "round";
    g.stroke();
  }
}

function tinted(mask, color) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.drawImage(mask, 0, 0);
  g.globalCompositeOperation = "source-in";
  g.fillStyle = color;
  g.fillRect(0, 0, W, H);
  return c;
}

function makeShape(rand, level) {
  for (let attempt = 0; ; attempt++) {
    const parts = makeParts(rand, level);

    // fit the solid parts into the canvas with a margin
    const boxes = parts.filter(p => !p.sub).map(partBox);
    const x0 = Math.min(...boxes.map(b => b[0])), y0 = Math.min(...boxes.map(b => b[1]));
    const x1 = Math.max(...boxes.map(b => b[2])), y1 = Math.max(...boxes.map(b => b[3]));
    const s = Math.min((W - 120) / (x1 - x0), (H - 90) / (y1 - y0), 200);

    const mask = document.createElement("canvas");
    mask.width = W; mask.height = H;
    const g = mask.getContext("2d");
    g.setTransform(s, 0, 0, s, W / 2 - (x0 + x1) / 2 * s, H / 2 - (y0 + y1) / 2 * s);
    parts.forEach(p => drawPart(g, p));

    // per-pixel coverage, used for exact-ish area measuring
    const data = g.getImageData(0, 0, W, H).data;
    const alpha = new Uint8Array(W * H);
    let total = 0, bx0 = W, by0 = H, bx1 = 0, by1 = 0;
    for (let i = 0; i < W * H; i++) {
      const a = data[i * 4 + 3];
      if (!a) continue;
      alpha[i] = a; total += a;
      const x = i % W, y = (i / W) | 0;
      if (x < bx0) bx0 = x; if (x > bx1) bx1 = x;
      if (y < by0) by0 = y; if (y > by1) by1 = y;
    }
    // too small after bites? roll again (still deterministic: same rand stream)
    if (total < W * H * 255 * 0.07 && attempt < 6) continue;
    return { mask, alpha, total, box: [bx0, by0, bx1, by1],
             orange: tinted(mask, "#ffb347"), a: tinted(mask, "rgba(255,179,71,0.9)"), b: tinted(mask, "rgba(90,209,160,0.9)") };
  }
}

// ===== Geometry =====
function longLine(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const k = 2000 / L;
  return [[a[0] - dx * k, a[1] - dy * k], [a[0] + dx * k, a[1] + dy * k]];
}

// split the shape's pixels by which side of line a→b they fall on
function cutResult(shape, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const [bx0, by0, bx1, by1] = shape.box;
  let s1 = 0, x1 = 0, y1 = 0, x2 = 0, y2 = 0;
  for (let y = by0; y <= by1; y++) {
    const py = y + 0.5;
    for (let x = bx0; x <= bx1; x++) {
      const al = shape.alpha[y * W + x];
      if (!al) continue;
      const px = x + 0.5;
      if (dx * (py - a[1]) - dy * (px - a[0]) >= 0) { s1 += al; x1 += px * al; y1 += py * al; }
      else { x2 += px * al; y2 += py * al; }
    }
  }
  const s2 = shape.total - s1;
  const a1 = s1 / shape.total * 100;
  return { a1, a2: 100 - a1,
           c1: s1 ? [x1 / s1, y1 / s1] : null, c2: s2 ? [x2 / s2, y2 / s2] : null };
}

// big polygon covering one side of line a→b (sign 1 = the side cutResult counts as a1)
function halfPlane(a, b, sign) {
  const [l1, l2] = longLine(a, b);
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L * 4000 * sign, ny = dx / L * 4000 * sign;
  ctx.beginPath();
  ctx.moveTo(l1[0], l1[1]); ctx.lineTo(l2[0], l2[1]);
  ctx.lineTo(l2[0] + nx, l2[1] + ny); ctx.lineTo(l1[0] + nx, l1[1] + ny);
  ctx.closePath();
}

// ===== Scoring =====
const err = c => Math.abs(c.a1 - 50);
const scoreFor = c => Math.max(0, Math.round(100 - err(c) * 8));
function emojiFor(c) {
  const e = err(c);
  if (e < 0.5) return "🎯";
  if (e < 2) return "🟩";
  if (e < 5) return "🟨";
  return "🟥";
}
const fmt = c => {
  const lo = Math.min(c.a1, c.a2), hi = Math.max(c.a1, c.a2);
  return lo.toFixed(1) + " / " + hi.toFixed(1);
};

// ===== Drawing =====
function draw() {
  ctx.fillStyle = "#0f1115";
  ctx.fillRect(0, 0, W, H);
  // dot grid
  ctx.fillStyle = "#1e232c";
  for (let x = 20; x < W; x += 40) for (let y = 20; y < H; y += 40) ctx.fillRect(x - 1, y - 1, 2, 2);

  const shape = shapes[ri];
  const cut = cuts[ri];

  if (cut) {
    [[1, shape.a], [-1, shape.b]].forEach(([sign, img]) => {
      ctx.save(); halfPlane(cut.a, cut.b, sign); ctx.clip();
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    });
    const [l1, l2] = longLine(cut.a, cut.b);
    ctx.strokeStyle = "#e8eaf0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(l1[0], l1[1]); ctx.lineTo(l2[0], l2[1]); ctx.stroke();
    ctx.font = "bold 20px system-ui"; ctx.textAlign = "center";
    [[cut.c1, cut.a1], [cut.c2, cut.a2]].forEach(([c, v]) => {
      if (!c) return;
      const [x, y] = c;
      ctx.fillStyle = "rgba(15,17,21,0.75)";
      ctx.fillRect(x - 36, y - 18, 72, 28);
      ctx.fillStyle = "#e8eaf0";
      ctx.fillText(v.toFixed(1) + "%", x, y + 3);
    });
  } else {
    ctx.drawImage(shape.orange, 0, 0);
    if (dragA && dragB) {
      const [l1, l2] = longLine(dragA, dragB);
      ctx.save();
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = "rgba(232,234,240,0.9)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(l1[0], l1[1]); ctx.lineTo(l2[0], l2[1]); ctx.stroke();
      ctx.restore();
    }
  }
}

// ===== Input =====
cv.addEventListener("pointerdown", e => {
  if (phase !== "cut") return;
  const p = Daily.point(cv, e);
  dragA = [p.x, p.y]; dragB = null;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (phase !== "cut" || !dragA) return;
  const p = Daily.point(cv, e);
  dragB = [p.x, p.y];
  draw();
});
cv.addEventListener("pointerup", () => {
  if (phase !== "cut" || !dragA) return;
  const a = dragA, b = dragB;
  dragA = dragB = null;
  if (!b || Math.hypot(b[0] - a[0], b[1] - a[1]) < 25) {
    $("msg").textContent = "Drag a longer line across the shape.";
    draw();
    return;
  }
  const c = cutResult(shapes[ri], a, b);
  if (Math.min(c.a1, c.a2) < 0.5) {
    $("msg").textContent = "Missed! Your line has to go through the shape. Try again.";
    draw();
    return;
  }
  cuts[ri] = Object.assign(c, { a, b });
  finishRound();
});

function finishRound() {
  const c = cuts[ri];
  $("msg").textContent = fmt(c) + "  ·  " + scoreFor(c) + " points";
  if (ri < ROUNDS - 1) {
    phase = "between";
    $("nextBtn").classList.remove("hidden");
  } else {
    phase = "done";
    if (mode === "daily") Daily.save(NAME, { cuts: cuts.map(c => [c.a, c.b]) });
    showResult();
  }
  draw();
}

function showResult() {
  const total = cuts.reduce((s, c) => s + scoreFor(c), 0);
  $("total").textContent = total + " / " + ROUNDS * 100;
  $("emojis").textContent = cuts.map(emojiFor).join("");
  $("result").classList.remove("hidden");
  $("nextBtn").classList.add("hidden");
  $("practiceBtn").classList.remove("hidden");
  if (mode === "daily") {
    $("shareBtn").classList.remove("hidden");
    Daily.countdown($("sub"), "Half");
  } else {
    $("shareBtn").classList.add("hidden");
    Daily.stopCountdown();
    $("sub").textContent = "Practice round. Your daily score is saved separately.";
  }
}

$("nextBtn").onclick = () => {
  ri++;
  phase = "cut";
  $("hud").textContent = "Shape " + (ri + 1) + " / " + ROUNDS;
  $("msg").textContent = "Next shape. Cut it in half.";
  $("nextBtn").classList.add("hidden");
  draw();
};

$("shareBtn").onclick = () => {
  const total = cuts.reduce((s, c) => s + scoreFor(c), 0);
  const text = "Half #" + Daily.dayNum + "  " + total + "/" + ROUNDS * 100 + "\n" +
    cuts.map(emojiFor).join("") + "\n" +
    cuts.map(fmt).join("\n") + "\n" + (location.host || "dailyish");
  Daily.share(text, $("shareBtn"));
};

$("practiceBtn").onclick = () => {
  mode = "practice";
  $("modeLabel").textContent = "· practice";
  start(Daily.rng(Math.floor(Math.random() * 1e9)));
};

function start(rand) {
  shapes = [0, 1, 2].map(level => makeShape(rand, level));
  ri = 0; cuts = []; phase = "cut"; dragA = dragB = null;
  $("hud").textContent = "Shape 1 / " + ROUNDS;
  $("msg").textContent = "Drag one straight line to cut the shape into two equal halves.";
  $("result").classList.add("hidden");
  $("shareBtn").classList.add("hidden");
  $("practiceBtn").classList.add("hidden");
  $("nextBtn").classList.add("hidden");
  draw();
}

// ===== Boot =====
start(Daily.rng(Daily.seedFor(NAME)));
const saved = Daily.load(NAME);
if (saved && saved.cuts) {
  cuts = saved.cuts.map(([a, b], i) => Object.assign(cutResult(shapes[i], a, b), { a, b }));
  ri = ROUNDS - 1;
  phase = "done";
  $("hud").textContent = "Shape " + ROUNDS + " / " + ROUNDS;
  showResult();
  $("msg").textContent = "You already cut today's shapes.";
  draw();
}
</script>
</body>
</html>
